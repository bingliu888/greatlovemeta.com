name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate detailed release manifest
        run: node scripts/release-manifest.mjs --require-current-commit

      - name: Ensure private class-media bucket
        run: npx wrangler r2 bucket create greatlovemeta-com-class-files --config wrangler.cloudflare.jsonc || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply greatlovemeta-com-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Compile SmartPay3 artifacts
        run: npm run contracts:compile

      - name: Lint authored source with zero-warning policy
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run complete contract suite
        run: node --test tests/*.test.mjs

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production disclaimer release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "https://greatlovemeta.com/zh/disclaimer" -o disclaimer.html \
              && grep -Eq 'All payments are final and non-refundable|所有付款均为最终付款且不可退款' disclaimer.html \
              && grep -Fq 'Facebook' disclaimer.html \
              && grep -Fq 'TikTok' disclaimer.html \
              && grep -Fq '/disclaimer' disclaimer.html \
              && grep -Fq '/zh/pricing' disclaimer.html; then
              exit 0
            fi
            sleep 5
          done
          echo "Localized production disclaimer verification failed." >&2
          exit 1

      - name: Configure classroom runtime secret
        shell: bash
        run: |
          if [[ -z "$REALTIMEKIT_API_TOKEN" ]]; then
            echo "Dedicated RealtimeKit token is not configured; preserving the existing Worker secret."
            exit 0
          fi
          printf '%s' "$REALTIMEKIT_API_TOKEN" | npx wrangler secret put CLOUDFLARE_REALTIME_API_TOKEN --config wrangler.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.CLOUDFLARE_REALTIME_API_TOKEN }}

      - name: Verify production subscription release
        shell: bash
        run: |
          verify_content() {
            local url="$1" pattern="$2" output="$3"
            for attempt in {1..12}; do
              if curl -fsS "$url" -o "$output" && grep -Fq "$pattern" "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          verify_content https://greatlovemeta.com/en/pricing 'GREATLOVEMETA PREMIUM' pricing.html
          grep -Fq '/en/pricing/crypto' pricing.html
          grep -Fq '$5' pricing.html
          grep -Fq '$8' pricing.html
          ! grep -Fq 'Six months' pricing.html
          verify_content https://greatlovemeta.com/en/pricing/crypto 'CRYPTO PAYMENT' crypto-checkout.html
          ! grep -Eq 'SmartPay3|mainID|secondID' crypto-checkout.html
          verify_content https://greatlovemeta.com/contracts/SmartPay3.abi.json '"pay"' smartpay3-abi.json
          verify_content https://greatlovemeta.com/locales/public-interface/ja.json '"Copy RefID"' ja-interface.json
          verify_content https://greatlovemeta.com/locales/public-interface/ar.json '"Copy wallet address"' ar-interface.json
          verify_content https://greatlovemeta.com/api/billing/status '"signedIn":false' billing-status.json

      - name: Verify production language menu release
        shell: bash
        run: |
          for attempt in {1..12}; do
            curl -fsS https://greatlovemeta.com/en -o home.html
            if grep -Fq 'header-language-menu' home.html; then
              grep -oE 'href="[^"]+\.css[^"]*"' home.html | cut -d'"' -f2 | while read -r stylesheet; do
                case "$stylesheet" in
                  http*) css_url="$stylesheet" ;;
                  *) css_url="https://greatlovemeta.com$stylesheet" ;;
                esac
                curl -fsS "$css_url"
              done > production.css
              if grep -Fq 'width:330px;max-width:calc(100vw - 28px);max-inline-size:calc(100vw - 28px)' production.css; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Record exact deployment report
        run: |
          node scripts/deployment-report-sql.mjs > deployment-report.sql
          npx wrangler d1 execute greatlovemeta-com-cutover-20260801-d1 --remote --config wrangler.cloudflare.jsonc --file deployment-report.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


      - name: Verify current production Project release details
        run: node scripts/verify-production-release-report.mjs

      - name: Verify public Project release evidence
        run: |
          curl -fsS https://greatlovemeta.com/api/project-sync -o project.json
          grep -Fq "${GITHUB_SHA}" project.json
          grep -Fq "${GITHUB_RUN_ID}" project.json
